server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: trip-service
          uri: ${TRANSITFLOW_TRIP_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/trips/**
        - id: booking-service
          uri: ${TRANSITFLOW_BOOKING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/bookings/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway, prometheus
  endpoint:
    health:
      show-details: always
