name: transitflow

services:
  # ---- Infrastructure ----
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: transitflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: transitflow-cluster-0001
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  trips-db:
    image: postgres:16-alpine
    container_name: transitflow-trips-db
    environment:
      POSTGRES_DB: trips
      POSTGRES_USER: transitflow
      POSTGRES_PASSWORD: transitflow
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transitflow -d trips"]
      interval: 5s
      timeout: 5s
      retries: 10

  bookings-db:
    image: postgres:16-alpine
    container_name: transitflow-bookings-db
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: transitflow
      POSTGRES_PASSWORD: transitflow
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transitflow -d bookings"]
      interval: 5s
      timeout: 5s
      retries: 10

  payments-db:
    image: postgres:16-alpine
    container_name: transitflow-payments-db
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: transitflow
      POSTGRES_PASSWORD: transitflow
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transitflow -d payments"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- Services ----
  trip-service:
    build: ./trip-service
    container_name: transitflow-trip-service
    depends_on:
      trips-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://trips-db:5432/trips
      SPRING_DATASOURCE_USERNAME: transitflow
      SPRING_DATASOURCE_PASSWORD: transitflow
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8081:8081"

  booking-service:
    build: ./booking-service
    container_name: transitflow-booking-service
    depends_on:
      bookings-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://bookings-db:5432/bookings
      SPRING_DATASOURCE_USERNAME: transitflow
      SPRING_DATASOURCE_PASSWORD: transitflow
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TRANSITFLOW_TRIP_SERVICE_URL: http://trip-service:8081
    ports:
      - "8082:8082"

  payment-service:
    build: ./payment-service
    container_name: transitflow-payment-service
    depends_on:
      payments-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://payments-db:5432/payments
      SPRING_DATASOURCE_USERNAME: transitflow
      SPRING_DATASOURCE_PASSWORD: transitflow
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TRANSITFLOW_PAYMENT_DECLINE_ABOVE: "500.00"
    ports:
      - "8083:8083"

  notification-service:
    build: ./notification-service
    container_name: transitflow-notification-service
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8084:8084"

  api-gateway:
    build: ./api-gateway
    container_name: transitflow-api-gateway
    depends_on:
      - trip-service
      - booking-service
    environment:
      TRANSITFLOW_TRIP_SERVICE_URL: http://trip-service:8081
      TRANSITFLOW_BOOKING_SERVICE_URL: http://booking-service:8082
    ports:
      - "8080:8080"

  # ---- Observability ----
  prometheus:
    image: prom/prometheus
    container_name: transitflow-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: transitflow-grafana
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
